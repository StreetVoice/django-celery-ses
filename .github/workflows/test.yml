name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: "Django ${{ matrix.django-version }} / Python ${{ matrix.python-version }}"
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Django 3.2 (LTS): Python 3.8-3.10
          - python-version: "3.8"
            django-version: "3.2"
            django-range: "django>=3.2,<4.0"
          - python-version: "3.10"
            django-version: "3.2"
            django-range: "django>=3.2,<4.0"

          # Django 4.0: Python 3.8-3.10
          - python-version: "3.8"
            django-version: "4.0"
            django-range: "django>=4.0,<4.1"
          - python-version: "3.10"
            django-version: "4.0"
            django-range: "django>=4.0,<4.1"

          # Django 4.1: Python 3.8-3.11
          - python-version: "3.8"
            django-version: "4.1"
            django-range: "django>=4.1,<4.2"
          - python-version: "3.11"
            django-version: "4.1"
            django-range: "django>=4.1,<4.2"

          # Django 4.2 (LTS): Python 3.8-3.12
          - python-version: "3.8"
            django-version: "4.2"
            django-range: "django>=4.2,<5.0"
          - python-version: "3.12"
            django-version: "4.2"
            django-range: "django>=4.2,<5.0"

          # Django 5.0: Python 3.10-3.12
          - python-version: "3.10"
            django-version: "5.0"
            django-range: "django>=5.0,<5.1"
          - python-version: "3.12"
            django-version: "5.0"
            django-range: "django>=5.0,<5.1"

          # Django 5.1: Python 3.10-3.13
          - python-version: "3.10"
            django-version: "5.1"
            django-range: "django>=5.1,<5.2"
          - python-version: "3.13"
            django-version: "5.1"
            django-range: "django>=5.1,<5.2"

          # Django 5.2 (LTS): Python 3.10-3.13
          - python-version: "3.10"
            django-version: "5.2"
            django-range: "django>=5.2,<6.0"
          - python-version: "3.13"
            django-version: "5.2"
            django-range: "django>=5.2,<6.0"

          # Django 6.0: Python 3.12-3.14
          - python-version: "3.12"
            django-version: "6.0"
            django-range: "django>=6.0,<6.1"
          - python-version: "3.14"
            django-version: "6.0"
            django-range: "django>=6.0,<6.1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "${{ matrix.django-range }}" celery

      - name: Run test suite
        run: python runtests.py
