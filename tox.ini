[tox]
envlist =
    py{38,310}-dj32
    py{38,310}-dj40
    py{38,311}-dj41
    py{38,312}-dj42
    py{310,312}-dj50
    py{310,313}-dj51
    py{310,313}-dj52
    py{312,314}-dj60
skipsdist=True

[testenv]
basepython =
    py38: python3.8
    py39: python3.9
    py310: python3.10
    py311: python3.11
    py312: python3.12
    py313: python3.13
    py314: python3.14
deps =
    celery
    dj32: django>=3.2,<4.0
    dj40: django>=4.0,<4.1
    dj41: django>=4.1,<4.2
    dj42: django>=4.2,<5.0
    dj50: django>=5.0,<5.1
    dj51: django>=5.1,<5.2
    dj52: django>=5.2,<6.0
    dj60: django>=6.0,<6.1
commands = python runtests.py
